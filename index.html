<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>QR Menü</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0; padding: 0;
    }
    header {
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .lang-btn {
      margin: 5px;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #007bff;
      color: white;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      justify-content: center;
      background: #fff;
      border-bottom: 2px solid #ddd;
    }
    .tab {
      flex: 1;
      padding: 15px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
    }
    .tab.active {
      background: #007bff;
      color: white;
    }
    .menu {
      display: none;
      padding: 20px;
    }
    .menu.active {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .item {
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .item img {
      max-width: 100%;
      border-radius: 10px;
    }
    .item h3 {
      margin: 10px 0 5px;
      font-size: 18px;
    }
    .item p {
      margin: 0;
      font-size: 14px;
      color: #666;
    }
    .price {
      font-weight: bold;
      color: #333;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Menü</h1>
    <button class="lang-btn" onclick="changeLang('tr')">Türkçe</button>
    <button class="lang-btn" onclick="changeLang('en')">English</button>
    <button class="lang-btn" onclick="changeLang('ar')">العربية</button>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="openTab('foods')"
         id="foods-tab">Yemekler</div>
    <div class="tab" onclick="openTab('drinks')"
         id="drinks-tab">İçecekler</div>
  </div>

  <div id="foods" class="menu active"></div>
  <div id="drinks" class="menu"></div>

  <script>
    const data = {
      tr: {
        title: "Menü",
        tabs: { foods: "Yemekler", drinks: "İçecekler" },
        foods: [
          { name: "Kebap", price: "120₺", img: "https://via.placeholder.com/200?text=Kebap" },
          { name: "Lahmacun", price: "80₺", img: "https://via.placeholder.com/200?text=Lahmacun" },
          { name: "Pide", price: "90₺", img: "https://via.placeholder.com/200?text=Pide" }
        ],
        drinks: [
          { name: "Ayran", price: "20₺", img: "https://via.placeholder.com/200?text=Ayran" },
          { name: "Çay", price: "15₺", img: "https://via.placeholder.com/200?text=Çay" },
          { name: "Kola", price: "30₺", img: "https://via.placeholder.com/200?text=Kola" }
        ]
      },
      en: {
        title: "Menu",
        tabs: { foods: "Foods", drinks: "Drinks" },
        foods: [
          { name: "Kebab", price: "120₺", img: "https://via.placeholder.com/200?text=Kebab" },
          { name: "Lahmacun", price: "80₺", img: "https://via.placeholder.com/200?text=Lahmacun" },
          { name: "Pide", price: "90₺", img: "https://via.placeholder.com/200?text=Pide" }
        ],
        drinks: [
          { name: "Ayran", price: "20₺", img: "https://via.placeholder.com/200?text=Ayran" },
          { name: "Tea", price: "15₺", img: "https://via.placeholder.com/200?text=Tea" },
          { name: "Cola", price: "30₺", img: "https://via.placeholder.com/200?text=Cola" }
        ]
      },
      ar: {
        title: "القائمة",
        tabs: { foods: "الطعام", drinks: "المشروبات" },
        foods: [
          { name: "كباب", price: "120₺", img: "https://via.placeholder.com/200?text=Kebab" },
          { name: "لحمجون", price: "80₺", img: "https://via.placeholder.com/200?text=Lahmacun" },
          { name: "بيتزا تركية", price: "90₺", img: "https://via.placeholder.com/200?text=Pide" }
        ],
        drinks: [
          { name: "عيران", price: "20₺", img: "https://via.placeholder.com/200?text=Ayran" },
          { name: "شاي", price: "15₺", img: "https://via.placeholder.com/200?text=Tea" },
          { name: "كوكاكولا", price: "30₺", img: "https://via.placeholder.com/200?text=Cola" }
        ]
      }
    };

    function renderMenu(lang) {
      document.getElementById("title").innerText = data[lang].title;
      document.getElementById("foods-tab").innerText = data[lang].tabs.foods;
      document.getElementById("drinks-tab").innerText = data[lang].tabs.drinks;

      const foodsDiv = document.getElementById("foods");
      foodsDiv.innerHTML = "";
      data[lang].foods.forEach(item => {
        foodsDiv.innerHTML += `
          <div class="item">
            <img src="${item.img}" alt="${item.name}">
            <h3>${item.name}</h3>
            <p class="price">${item.price}</p>
          </div>`;
      });

      const drinksDiv = document.getElementById("drinks");
      drinksDiv.innerHTML = "";
      data[lang].drinks.forEach(item => {
        drinksDiv.innerHTML += `
          <div class="item">
            <img src="${item.img}" alt="${item.name}">
            <h3>${item.name}</h3>
            <p class="price">${item.price}</p>
          </div>`;
      });
    }

    function changeLang(lang) {
      renderMenu(lang);
    }

    function openTab(tabName) {
      document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
      document.querySelectorAll(".menu").forEach(menu => menu.classList.remove("active"));

      document.getElementById(tabName + "-tab").classList.add("active");
      document.getElementById(tabName).classList.add("active");
    }

    // Varsayılan Türkçe açılır
    renderMenu("tr");
  </script>
</body>
</html>
